[package]
name = "oblita-host"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
dirs = "=7.0.0"
fs4 = "=1.1.0"
getrandom = "=0.4.3"
# 0.14.0 e não 0.15.0: o docs.rs não conseguiu gerar a documentação da 0.15.0.
if-addrs = "=0.14.0"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
# Só o diálogo de pasta. No Linux, sem portal, o menu cai para digitar o caminho.
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

# O_NOFOLLOW: abrir arquivo sem seguir link.
[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[target.'cfg(windows)'.build-dependencies]
winresource = "=0.1.34"

# Sem panic = "abort": um pânico deve derrubar só uma conexão, nunca o hub inteiro.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
